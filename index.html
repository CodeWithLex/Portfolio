<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lex Matondo — Personal Portfolio</title>
  <meta name="description" content="Personal portfolio of Lex Matondo — Computer Engineering student, developer, and photographer.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23050505'/%3E%3Ctext x='16' y='21' font-family='sans-serif' font-size='14' font-weight='600' fill='%23F2F2F0' text-anchor='middle'%3EL%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="landing-body">

  <div class="landing-container">

    <!-- Header -->
    <header class="landing-header">
      <span class="header-name">LEX MATONDO</span>
      <span class="header-desc">Computer Engineering / Visual Work</span>
    </header>

    <!-- Center Selection Prompt -->
    <div class="prompt-bar" aria-hidden="true">
      <span class="prompt-text">WHAT DO YOU WANT TO EXPLORE?</span>
    </div>

    <!-- Main 50/50 Split -->
    <main class="landing-split" id="split-hero" role="region" aria-label="Discipline Selection">

      <!-- LEFT: TECH -->
      <a class="split-side side-tech" id="side-tech" href="portfolio.html?mode=code" aria-label="Explore Tech — Code, Systems, Engineering">
        <div class="side-media tech-media" aria-hidden="true">
          <img src="assets/projects/coelgu-system.png" alt="COE LGU System" loading="eager" decoding="async">
        </div>
        <div class="side-content">
          <div class="side-head">
            <span class="side-number">01</span>
            <span class="side-tag">SYSTEMS</span>
          </div>
          <h2 class="side-title">TECH</h2>
          <p class="side-sub">Code · Systems · Engineering</p>
          <div class="side-enter" aria-hidden="true">
            <span class="enter-label">ENTER TECH</span>
            <span class="enter-arrow">→</span>
          </div>
        </div>
      </a>

      <!-- VERTICAL DIVIDER -->
      <div class="split-divider" aria-hidden="true"></div>

      <!-- RIGHT: CREATE -->
      <a class="split-side side-create" id="side-create" href="portfolio.html?mode=create" aria-label="Explore Create — Photography, Film, Visuals">
        <div class="side-media create-media" aria-hidden="true">
          <img src="assets/photos/full/portraits-2.jpg" alt="Editorial Portrait" loading="eager" decoding="async">
        </div>
        <div class="side-content">
          <div class="side-head">
            <span class="side-number">02</span>
            <span class="side-tag">VISUALS</span>
          </div>
          <h2 class="side-title">CREATE</h2>
          <p class="side-sub">Photography · Film · Visuals</p>
          <div class="side-enter" aria-hidden="true">
            <span class="enter-label">ENTER CREATE</span>
            <span class="enter-arrow">→</span>
          </div>
        </div>
      </a>

    </main>

    <!-- Footer -->
    <footer class="landing-footer">
      <span class="footer-location">Digos City · Philippines</span>
      <span class="footer-copyright">© 2026</span>
    </footer>

    <!-- Shutter Transition Blade -->
    <div class="landing-shutter-layer" id="landing-shutter" aria-hidden="true"></div>

  </div>

  <script src="script.js" defer></script>
</body>
</html>
